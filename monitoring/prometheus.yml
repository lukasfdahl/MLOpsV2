global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "mlops_inference"
    static_configs:
      - targets: ["inference-api:8000"]

  # Host metrics (CPU / mem / disk / net) — docker-compose.system.yml
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics (CPU / mem) — docker-compose.system.yml
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # GPU metrics (util / mem / temp) — docker-compose.gpu.yml
  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:9400"]

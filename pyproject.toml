[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/benchmark.py",   # performance benchmark, not a unit-test target
    "src/ui.py",          # Streamlit UI, exercised manually
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1

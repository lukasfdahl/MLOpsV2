repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace      # Removes weird invisible spaces
    -   id: end-of-file-fixer        # Ensures files end with a blank line
    -   id: check-yaml               # Makes sure your config.yaml isn't broken
    -   id: check-added-large-files  # Teacher's requirement: prevents committing 50GB datasets
        args: ['--maxkb=50000']      # Max file size is 50MB
    -   id: detect-private-key       # Teacher's requirement: catches hardcoded API keys/secrets

-   repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
    -   id: flake8                   # Teacher's requirement: checks PEP8 coding standards
        args: ['--max-line-length=100'] # Gives you a bit more room than the default 80 chars

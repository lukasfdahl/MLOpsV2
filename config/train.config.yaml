dataset_path: data/coco128_small

epochs: 3
batch: 60          # smaller batch for CPU
imgsz: 640
patience: 20
workers: 2        # important on Mac

optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0

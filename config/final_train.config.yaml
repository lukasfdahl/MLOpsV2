settings:
  use_sample_dataset: False # Set to True to train locally (uses small 128 image dataset instead of full one)
  ailab_training: True # Set to True to use AILab's training environment, False to train locally 


path:
  run_base_dir: runs # Used as a base path for files generated when running the code, like model fiels from training
  sample_dataset_path: data/coco128_small
  full_dataset_path: data/dvc


training:
  epochs: 3
  batch_size: 60
  learning_rate: 0.0001
  weight_decay: 0.0005
